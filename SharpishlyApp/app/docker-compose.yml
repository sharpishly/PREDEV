version: "3.9"

services:
  # ============================================================
  # SSL CERTIFICATE GENERATION (replaces build.sh SSL logic)
  # ============================================================
  certgen:
    image: alpine:latest
    container_name: certgen
    volumes:
      - ./certs:/certs
    command: >
      sh -c "
      apk add --no-cache openssl &&
      if [ ! -f /certs/sharpishly.dev.crt ]; then
        echo '🔐 Generating self-signed certificate for sharpishly.dev' &&
        openssl req -x509 -newkey rsa:4096 \
          -keyout /certs/sharpishly.dev.key \
          -out /certs/sharpishly.dev.crt \
          -days 365 -nodes \
          -subj '/C=US/ST=California/L=Manchester/O=Sharpishly/CN=sharpishly.dev';
      else
        echo '✅ Certificate already exists — skipping';
      fi"
    restart: "no"

  # ============================================================
  # PHP-FPM (Core for SharpishlyApp + PREDEV)
  # ============================================================
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_fpm
    restart: unless-stopped
    volumes:
      - ./sharpishly.com:/var/www/app/sharpishly.com
      - ./dev.sharpishly.com:/var/www/app/dev.sharpishly.com
      - ./python_mvc:/var/www/app/python_mvc
      - ./python_app:/var/www/app/python_app
    environment:
      - DB_HOST=db
      - DB_USER=sharpishly_user
      - DB_PASSWORD=admin12345
      - DB_NAME=sharpishly_db
      - PG_HOST=postgres
      - PG_USER=sharpishly_user
      - PG_PASSWORD=admin12345
      - PG_DATABASE=sharpishly_db
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # NGINX REVERSE PROXY (serves SharpishlyApp)
  # ============================================================
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./sharpishly.com/website/public:/var/www/app/sharpishly.com/website/public
      - ./dev.sharpishly.com/website/:/var/www/app/dev.sharpishly.com/website/public
      - ./debug/:/var/www/app/debug/
      - ./certs/sharpishly.dev.crt:/etc/nginx/ssl/sharpishly.dev.crt:ro
      - ./certs/sharpishly.dev.key:/etc/nginx/ssl/sharpishly.dev.key:ro
    networks:
      - app-network
    depends_on:
      - php
      - certgen
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # MYSQL DATABASE
  # ============================================================
  # db:
  #   image: mysql:8.0
  #   container_name: app-db-1
  #   restart: unless-stopped
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - MYSQL_DATABASE=sharpishly_db
  #     - MYSQL_USER=sharpishly_user
  #     - MYSQL_PASSWORD=admin12345
  #     - MYSQL_ROOT_PASSWORD=admin12345
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./mysql/logs:/var/log/mysql
  #   networks:
  #     - app-network
  #   command: >
  #     --default-authentication-plugin=mysql_native_password
  #     --port=3306
  #     --bind-address=0.0.0.0
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin12345"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # ============================================================
  # MYSQL DATABASE (Fixed healthcheck)
  # ============================================================
  db:
    image: mysql:8.0
    container_name: app-db-1
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=sharpishly_db
      - MYSQL_USER=sharpishly_user
      - MYSQL_PASSWORD=admin12345
      - MYSQL_ROOT_PASSWORD=admin12345
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/logs:/var/log/mysql
    networks:
      - app-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --port=3306
      --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -padmin12345 | grep 'mysqld is alive' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s


  # ============================================================
  # POSTGRES DATABASE
  # ============================================================
  postgres:
    image: postgres:16
    container_name: app-postgres-1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sharpishly_db
      - POSTGRES_USER=sharpishly_user
      - POSTGRES_PASSWORD=admin12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/logs:/var/log/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharpishly_user"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # ADMINER (Database Management)
  # ============================================================
  adminer:
    image: adminer
    container_name: adminer_gui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - db
      - postgres

  # ============================================================
  # PORTAINER (Container Management GUI)
  # ============================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app-network

  # ============================================================
  # GLANCES (System Monitoring)
  # ============================================================
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
    pid: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    networks:
      - app-network

# ============================================================
# NETWORKS
# ============================================================
networks:
  app-network:
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  mysql_data:
  postgres_data:
  portainer_data:
