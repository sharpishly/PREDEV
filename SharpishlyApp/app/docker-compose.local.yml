version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_fpm_local
    restart: unless-stopped
    volumes:
      - ./sharpishly.com:/var/www/app/sharpishly.com
      - ./dev.sharpishly.com:/var/www/app/dev.sharpishly.com
    environment:
      - DB_HOST=db
      - DB_USER=sharpishly_user
      - DB_PASSWORD=admin12345
      - DB_NAME=sharpishly_db
      - IS_DOCKER=true
    networks:
      - app-network
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: nginx_proxy_local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf
      - ./dev.sharpishly.com/website/public:/var/www/app/dev.sharpishly.com/website/public
    networks:
      - app-network
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: app-db-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=sharpishly_db
      - MYSQL_USER=sharpishly_user
      - MYSQL_PASSWORD=admin12345
      - MYSQL_ROOT_PASSWORD=admin12345
    volumes:
      - mysql_data_local:/var/lib/mysql
    networks:
      - app-network

  # ============================================================
  # PYTHON STANDALONE APPLICATION
  # ============================================================
  python_app:
    build:
      context: ./python_app
    container_name: python_app_local
    ports:
      - "1987:8000"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data_local:
